heading: Everything you need to run your garage
subheading: From vehicle intake to release — job cards, parts, invoicing, payroll and full accounting in one place.

items:
  - title: Job Cards & Repair Tracking
    description: Open a job card for every vehicle, assign technicians, log labour and parts, and track progress from intake to completion.
    icon_bg: bg-accent-gradient
    icon_path: "M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"

  - title: Insurance Jobs
    description: Record claim and policy numbers against each job card, along with insurer and assessor details. Keep everything the insurer needs on hand so the job moves smoothly.
    icon_bg: bg-gray-900
    icon_path: "M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"

  - title: Parts Procurement & LPOs
    description: Issue LPOs to suppliers for parts and stock in bulk, track deliveries, and record supplier invoices. Parts flow into shared inventory, so any job card can draw from them without creating a separate order.
    icon_bg: bg-accent-gradient
    icon_path: "M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"

  - title: Vehicle & Customer Records
    description: Track every vehicle by plate, VIN, make and model. Link repairs, parts, claims and invoices to the vehicle and its owner for full service history.
    icon_bg: bg-gray-900
    icon_path: "M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0zM13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"

  - title: Invoicing & Quotations
    description: Create quotations and estimates, convert approved ones into job cards, and raise invoices from completed work — including supplemented jobs.
    icon_bg: bg-accent-gradient
    icon_path: "M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"

  - title: POS / Over-the-Counter Sales
    description: Sell spare parts, oil, and accessories at the counter. Instant receipts, thermal printing, and cash or mobile money payment records.
    icon_bg: bg-gray-900
    icon_path: "M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"

  - title: Spare Parts Inventory
    description: Track stock across bins and branches. Auto-deduct parts consumed on job cards, and view full movement history.
    icon_bg: bg-accent-gradient
    icon_path: "M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"

  - title: QC, Inspection & Vehicle Release
    description: Run quality checks before handover, capture before / after photos with a built-in viewer, collect a signed customer satisfaction note, and issue release authorization with a signed release letter.
    icon_bg: bg-gray-900
    icon_path: "M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"

  - title: Multi-Branch & Workspaces
    description: Run multiple garage branches under one organization. Switch between workspaces for separate garages or business entities.
    icon_bg: bg-accent-gradient
    icon_path: "M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"

  - title: Team & Permissions
    description: Invite front desk, technicians, store keepers and accountants with role-based access. Owners and admins control who sees what.
    icon_bg: bg-gray-900
    icon_path: "M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"

  - title: Chart of Accounts & VAT
    description: Pre-loaded Kenyan chart of accounts tuned for garages. Auto-calculate VAT on parts, labour and insurance jobs. KRA PIN and tax registration management.
    icon_bg: bg-accent-gradient
    icon_path: "M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"

  - title: Audit Logs & Security
    description: Every change is tracked with full audit history. Soft-deletes protect against accidental data loss. OTP verification for sensitive actions.
    icon_bg: bg-gray-900
    icon_path: "M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"

  - title: Purchases & Expenses
    description: Record supplier bills, utilities, rent, and overheads. Track payables, payment terms, and get a clear view of your garage's spending.
    icon_bg: bg-accent-gradient
    icon_path: "M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"

  - title: Credit Notes & Refunds
    description: Issue credit notes for customer invoices and supplier bills. Handle insurance adjustments, partial refunds, and corrections with a full audit trail.
    icon_bg: bg-gray-900
    icon_path: "M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2z"

  - title: Banking & Reconciliations
    description: Record bank and M-Pesa transactions, then match and reconcile them against your statements. No API connections required.
    icon_bg: bg-accent-gradient
    icon_path: "M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M3 10v11h18V10"

  - title: Payroll, Contracts & Leave
    description: Run payroll daily, weekly, biweekly, or monthly. Manage permanent, contract and casual staff, track timesheets and leave, and auto-calculate PAYE, SHIF, NSSF, NITA.
    icon_bg: bg-gray-900
    icon_path: "M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"

  - title: Salary Advances & Loans
    description: Manage salary advances and staff loans. Deduct repayments from payroll in installments as agreed, with full tracking of outstanding balances.
    icon_bg: bg-accent-gradient
    icon_path: "M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2z"

  - title: Accounting & Reports
    description: Trial balance, balance sheets, general ledger, journal entries, fixed asset register, and adjusting entries — full double-entry accounting built in.
    icon_bg: bg-gray-900
    icon_path: "M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"

tax_ready:
  - emoji: "📄"
    title: VAT Tracking
    description: Auto-compute output/input VAT on every invoice, job card and parts purchase. Export summaries for your accountant or iTax filing.
  - emoji: "🧾"
    title: KRA PIN & Tax Registrations
    description: Store your KRA PIN and tax registration types directly in your organization settings. VAT, Income Tax, and more.
  - emoji: "📊"
    title: Audit-Ready Records
    description: Full audit logs track every change across job cards, insurance jobs, and accounting entries. Your accountant will thank you.
