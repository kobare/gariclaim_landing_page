faq:
  - q: "What is Gariclaim?"
    a: "Gariclaim is a garage management platform built for African workshops. It handles job cards, insurance jobs, spare parts, invoicing, payroll, and full double-entry accounting in one system."
  - q: "How much does Gariclaim cost?"
    a: "Gariclaim starts at KES 1,500 per month for single-bay garages and goes up to KES 5,000 per month for established multi-branch operations."
  - q: "Is Gariclaim compliant with KRA requirements?"
    a: "Yes. Gariclaim ships with a pre-built Kenyan chart of accounts, automatic VAT calculation, and stores your KRA PIN and tax registration types."
